<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AntWallet 连接测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #eee;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 16px; color: #00e5ff; }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .value { font-size: 14px; word-break: break-all; font-family: monospace; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #0195fe, #22e9ff);
      color: #000;
      margin-bottom: 12px;
    }
    button:disabled { opacity: 0.5; }
    button.secondary {
      background: #262b2f;
      color: #eee;
      border: 1px solid #444;
    }
    .status { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    .status.ok { background: #0a3d1f; color: #4ade80; border: 1px solid #166534; }
    .status.err { background: #3d0a0a; color: #f87171; border: 1px solid #991b1b; }
    .status.info { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    #log { font-size: 12px; font-family: monospace; color: #666; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>AntWallet 连接测试</h1>

  <div id="status" class="status info">正在检测钱包...</div>

  <div class="card">
    <div class="label">检测到的 Provider</div>
    <div class="value" id="provider-info">—</div>
  </div>

  <div class="card">
    <div class="label">连接状态</div>
    <div class="value" id="connection-info">—</div>
  </div>

  <div class="card">
    <div class="label">Public Key</div>
    <div class="value" id="pubkey-info">—</div>
  </div>

  <button id="btn-connect">连接钱包</button>
  <button id="btn-sign" class="secondary" disabled>签名测试消息</button>
  <button id="btn-disconnect" class="secondary" disabled>断开连接</button>

  <div class="card">
    <div class="label">日志</div>
    <div id="log"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const log = (msg) => {
      const el = $('log');
      el.textContent += msg + '\n';
      console.log(msg);
    };
    const setStatus = (msg, type = 'info') => {
      const el = $('status');
      el.className = 'status ' + type;
      el.textContent = msg;
    };

    let provider = null;

    // ========== 1. 检测 Provider ==========
    function detectProvider() {
      // 按优先级检测：AntWallet → 通用 solana
      const candidates = [
        { name: 'window.antWallet.solana', obj: window.antWallet?.solana },
        { name: 'window.solana', obj: window.solana },
        { name: 'window.phantom.solana', obj: window.phantom?.solana },
      ];

      const found = [];
      for (const c of candidates) {
        if (c.obj) {
          found.push(c.name);
          // 优先用 antWallet，其次 solana
          if (!provider && c.obj.connect) {
            provider = c.obj;
          }
        }
      }

      if (provider) {
        setStatus('✅ 检测到 Solana Provider', 'ok');
        $('provider-info').textContent = found.join(' | ');
        log('检测到: ' + found.join(', '));

        // 打印关键标志位
        log('isAntWallet: ' + (provider.isAntWallet ?? 'undefined'));
        log('isPhantom: ' + (provider.isPhantom ?? 'undefined'));
        log('isConnected: ' + (provider.isConnected ?? 'undefined'));
        log('publicKey: ' + (provider.publicKey?.toBase58?.() ?? 'null'));

        // 如果已有 publicKey，说明已连接
        if (provider.publicKey) {
          onConnected(provider.publicKey);
        }
      } else {
        setStatus('❌ 未检测到任何 Solana Provider', 'err');
        $('provider-info').textContent = '无';
        log('未检测到 window.solana 或 window.antWallet.solana');
        log('请确认你在 AntWallet 内置浏览器中打开此页面');
      }
    }

    // ========== 2. 连接 ==========
    async function connect() {
      if (!provider) {
        setStatus('❌ 无 Provider，无法连接', 'err');
        return;
      }
      $('btn-connect').disabled = true;
      setStatus('正在连接...', 'info');
      try {
        const result = await provider.connect();
        const pk = result?.publicKey ?? provider.publicKey;
        if (!pk) throw new Error('连接成功但未返回 publicKey');
        onConnected(pk);
      } catch (err) {
        setStatus('❌ 连接失败: ' + (err?.message ?? err), 'err');
        log('连接错误: ' + JSON.stringify(err));
        $('btn-connect').disabled = false;
      }
    }

    function onConnected(publicKey) {
      const addr = publicKey.toBase58 ? publicKey.toBase58() : String(publicKey);
      setStatus('✅ 已连接', 'ok');
      $('connection-info').textContent = 'connected = true';
      $('pubkey-info').textContent = addr;
      $('btn-connect').disabled = true;
      $('btn-sign').disabled = false;
      $('btn-disconnect').disabled = false;
      log('已连接: ' + addr);
    }

    // ========== 3. 签名测试 ==========
    async function signMessage() {
      if (!provider) return;
      $('btn-sign').disabled = true;
      const msg = 'AntWallet test message: ' + Date.now();
      setStatus('等待签名...', 'info');
      try {
        const encoded = new TextEncoder().encode(msg);
        const result = await provider.signMessage(encoded);
        const sig = result?.signature ?? result;
        setStatus('✅ 签名成功', 'ok');
        log('消息: ' + msg);
        log('签名(Base58): ' + (sig?.toBase58?.() ?? sig));
      } catch (err) {
        setStatus('❌ 签名失败: ' + (err?.message ?? err), 'err');
        log('签名错误: ' + JSON.stringify(err));
      } finally {
        $('btn-sign').disabled = false;
      }
    }

    // ========== 4. 断开 ==========
    async function disconnect() {
      if (!provider) return;
      try {
        await provider.disconnect();
        setStatus('已断开', 'info');
        $('connection-info').textContent = '—';
        $('pubkey-info').textContent = '—';
        $('btn-connect').disabled = false;
        $('btn-sign').disabled = true;
        $('btn-disconnect').disabled = true;
        log('已断开连接');
      } catch (err) {
        log('断开错误: ' + err?.message);
      }
    }

    // ========== 5. 事件监听 ==========
    function bindEvents() {
      if (!provider) return;
      provider.on?.('connect', (pk) => {
        log('事件: connect');
        if (pk) onConnected(pk);
      });
      provider.on?.('disconnect', () => {
        log('事件: disconnect');
        disconnect();
      });
      provider.on?.('accountChanged', (pk) => {
        log('事件: accountChanged');
        if (pk) onConnected(pk);
      });
    }

    // ========== 初始化 ==========
    window.addEventListener('load', () => {
      // 延迟一点，等钱包注入完成
      setTimeout(() => {
        detectProvider();
        bindEvents();
      }, 300);
    });

    $('btn-connect').addEventListener('click', connect);
    $('btn-sign').addEventListener('click', signMessage);
    $('btn-disconnect').addEventListener('click', disconnect);
  </script>
</body>
</html>
